deploymentSpec:
  executors:
    exec-cleanup-ephemeral-endpoint-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - cleanup_ephemeral_endpoint_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-aiplatform>=1.60.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef cleanup_ephemeral_endpoint_op(\n    project_id: str,\n    region:\
          \ str,\n    job_name: str,\n    existing_endpoint: str = \"\",\n    existing_vertex_ai_url:\
          \ str = \"\",\n    cleanup_ephemeral_endpoint: bool = True,\n) -> str:\n\
          \  \"\"\"ExitHandler task: undeploys and deletes any ephemeral Endpoint\
          \ and Model.\"\"\"\n  # KFP v2 serializes only the component function body\
          \ into the container.\n  # pylint: disable=g-import-not-at-top\n  import\
          \ logging\n  import time\n\n  import google.auth  # pyrefly: ignore[missing-import]\n\
          \  # pyrefly: ignore[missing-module-attribute]\n  from google.cloud import\
          \ aiplatform_v1\n  # pylint: enable=g-import-not-at-top\n\n  logging.basicConfig(\n\
          \      level=logging.INFO,\n      format=\"%(asctime)s %(levelname)s %(message)s\"\
          ,\n  )\n\n  if (existing_endpoint or \"\").strip() or (\n      existing_vertex_ai_url\
          \ or \"\"\n  ).strip():\n    logging.info(\n        \"Pre-existing customer\
          \ endpoint specified; skipping ephemeral cleanup.\"\n    )\n    return \"\
          SKIPPED:existing_endpoint\"\n\n  if not cleanup_ephemeral_endpoint:\n  \
          \  logging.info(\n        \"cleanup_ephemeral_endpoint=False; retaining\
          \ ephemeral resources.\"\n    )\n    return \"SKIPPED:cleanup_disabled\"\
          \n\n  job_clean = (job_name or \"\").strip()\n  if not job_clean or \"{{\"\
          \ in job_clean:\n    logging.warning(\n        \"Invalid job_name %r; skipping\
          \ cleanup for safety.\", job_name\n    )\n    return \"SKIPPED:invalid_job_name\"\
          \n\n  region_clean = (region or \"\").strip()\n  if not region_clean:\n\
          \    return \"SKIPPED:missing_region\"\n\n  resolved_project = (project_id\
          \ or \"\").strip()\n  if not resolved_project or \"{{\" in resolved_project:\n\
          \    _, default_project = google.auth.default()\n    resolved_project =\
          \ default_project or \"\"\n  if not resolved_project:\n    raise ValueError(\"\
          Cannot determine project_id for ephemeral cleanup.\")\n\n  display_name\
          \ = f\"alphagenome-batch-{job_clean}\"[:128]\n  parent = f\"projects/{resolved_project}/locations/{region_clean}\"\
          \n  client_options = {\"api_endpoint\": f\"{region_clean}-aiplatform.googleapis.com\"\
          }\n\n  endpoint_client = aiplatform_v1.EndpointServiceClient(\n      client_options=client_options\n\
          \  )\n  model_client = aiplatform_v1.ModelServiceClient(client_options=client_options)\n\
          \n  deleted_resources: list[str] = []\n  cleanup_errors: list[str] = []\n\
          \n  matching_endpoints = [\n      ep\n      for ep in endpoint_client.list_endpoints(\n\
          \          request=aiplatform_v1.ListEndpointsRequest(\n              parent=parent,\
          \ filter=f'display_name=\"{display_name}\"'\n          )\n      )\n    \
          \  if ep.display_name == display_name\n  ]\n  for ep in matching_endpoints:\n\
          \    # Cancel and await any in-flight deploy/undeploy operations before\
          \ reading\n    # deployed_models so mid-deploy timeouts or cancellations\
          \ cannot leave\n    # newly finished replicas running after cleanup completes.\n\
          \    try:\n      ops_resp = endpoint_client.list_operations(request={\"\
          name\": ep.name})\n      active_ops = [\n          op for op in getattr(ops_resp,\
          \ \"operations\", ()) if not op.done\n      ]\n    except Exception as exc:\
          \  # pylint: disable=broad-exception-caught\n      logging.warning(\n  \
          \        \"Could not list operations on %s (%s); continuing cleanup.\",\n\
          \          ep.name,\n          exc,\n      )\n      active_ops = []\n\n\
          \    for op in active_ops:\n      try:\n        logging.info(\"Cancelling\
          \ in-flight operation %s...\", op.name)\n        endpoint_client.cancel_operation(request={\"\
          name\": op.name})\n      except Exception as exc:  # pylint: disable=broad-exception-caught\n\
          \        logging.warning(\"Cancel operation %s returned: %s\", op.name,\
          \ exc)\n\n    if active_ops:\n      deadline = time.monotonic() + 600.0\n\
          \      pending_op_names = [op.name for op in active_ops]\n      while pending_op_names\
          \ and time.monotonic() < deadline:\n        still_running: list[str] = []\n\
          \        for op_name in pending_op_names:\n          try:\n            cur_op\
          \ = endpoint_client.get_operation(request={\"name\": op_name})\n       \
          \     if not cur_op.done:\n              still_running.append(op_name)\n\
          \          except Exception as exc:  # pylint: disable=broad-exception-caught\n\
          \            logging.warning(\"Polling operation %s failed: %s\", op_name,\
          \ exc)\n            still_running.append(op_name)\n        pending_op_names\
          \ = still_running\n        if not pending_op_names:\n          break\n \
          \       time.sleep(5.0)\n      if pending_op_names:\n        msg = (\n \
          \           f\"Timed out waiting for active operation(s) {pending_op_names}\
          \ \"\n            f\"on {ep.name} to finish cancelling.\"\n        )\n \
          \       logging.error(msg)\n        cleanup_errors.append(msg)\n\n    try:\n\
          \      ep = endpoint_client.get_endpoint(name=ep.name)\n    except Exception\
          \ as exc:  # pylint: disable=broad-exception-caught\n      logging.warning(\n\
          \          \"Could not refresh endpoint %s (%s); using listed state.\",\n\
          \          ep.name,\n          exc,\n      )\n\n    for dm in ep.deployed_models:\n\
          \      try:\n        logging.info(\"Undeploying model %s from %s...\", dm.id,\
          \ ep.name)\n        endpoint_client.undeploy_model(\n            endpoint=ep.name,\
          \ deployed_model_id=dm.id\n        ).result(timeout=1800)\n      except\
          \ Exception as exc:  # pylint: disable=broad-exception-caught\n        msg\
          \ = f\"Failed undeploying {dm.id} from {ep.name}: {exc}\"\n        logging.error(msg)\n\
          \        cleanup_errors.append(msg)\n    try:\n      logging.info(\"Deleting\
          \ ephemeral endpoint %s...\", ep.name)\n      endpoint_client.delete_endpoint(name=ep.name).result(timeout=900)\n\
          \      deleted_resources.append(ep.name)\n    except Exception as exc: \
          \ # pylint: disable=broad-exception-caught\n      msg = f\"Failed deleting\
          \ endpoint {ep.name}: {exc}\"\n      logging.error(msg)\n      cleanup_errors.append(msg)\n\
          \n  matching_models = [\n      m\n      for m in model_client.list_models(\n\
          \          request=aiplatform_v1.ListModelsRequest(\n              parent=parent,\
          \ filter=f'display_name=\"{display_name}\"'\n          )\n      )\n    \
          \  if m.display_name == display_name\n  ]\n  for m in matching_models:\n\
          \    try:\n      logging.info(\"Deleting ephemeral model %s...\", m.name)\n\
          \      model_client.delete_model(name=m.name).result(timeout=900)\n    \
          \  deleted_resources.append(m.name)\n    except Exception as exc:  # pylint:\
          \ disable=broad-exception-caught\n      msg = f\"Failed deleting model {m.name}:\
          \ {exc}\"\n      logging.error(msg)\n      cleanup_errors.append(msg)\n\n\
          \  if cleanup_errors:\n    raise RuntimeError(\n        \"One or more ephemeral\
          \ resources failed to clean up: \"\n        + \"; \".join(cleanup_errors)\n\
          \    )\n\n  if not deleted_resources:\n    logging.info(\n        \"No ephemeral\
          \ resources found matching display_name=%r.\",\n        display_name,\n\
          \    )\n    return f\"NO_RESOURCES_FOUND:{display_name}\"\n\n  return \"\
          DELETED:\" + \",\".join(deleted_resources)\n\n"
        image: python:3.11-slim
    exec-resolve-or-provision-endpoint-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - resolve_or_provision_endpoint_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-aiplatform>=1.60.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef resolve_or_provision_endpoint_op(\n    project_id: str,\n   \
          \ region: str,\n    job_name: str,\n    input_gcs_uri: str,\n    output_gcs_uri:\
          \ str = \"\",\n    pipeline_root: str = \"\",\n    existing_endpoint: str\
          \ = \"\",\n    existing_vertex_ai_url: str = \"\",\n    model_version: str\
          \ = \"ALL_FOLDS\",\n    workers: int = 8,\n    timeout: float = 180.0,\n\
          \    max_retries: int = 4,\n    sdk_wheel_url: str = (\n        \"https://github.com/GoogleCloudPlatform/vertex-ai-samples/raw/\"\
          \n        \"552011a70573f69774f958f7519d144c35e8cc1d/\"\n        \"notebooks/community/alphagenome/whl/\"\
          \n        \"alphagenome_cloud_sdk-0.4.2.12-py3-none-any.whl\"\n        \"\
          #sha256=a872dd3f152d70e82977ea2e3129c584\"\n        \"6957347cfec7f164ae6eb351032f1acd\"\
          \n    ),\n    serving_image_uri: str = (\n        \"us-docker.pkg.dev/vertex-ai-restricted/\"\
          \n        \"alphagenome/alphagenome-inference:agv1_mg_004_rc_20261102\"\n\
          \    ),\n    serving_machine_type: str = \"\",\n    serving_accelerator_type:\
          \ str = \"NVIDIA_H100_80GB\",\n    serving_accelerator_count: int = 1,\n\
          \    serving_replica_count: int = 8,\n    serving_compute_reservation_id:\
          \ str = \"\",\n    encryption_spec_key_name: str = \"\",\n) -> NamedTuple(\
          \  # pyrefly: ignore[invalid-annotation]\n    \"EndpointResolution\",\n\
          \    [\n        (\"protocol\", str),\n        (\"target\", str),\n     \
          \   (\"ephemeral_endpoint_name\", str),\n        (\"ephemeral_model_name\"\
          , str),\n    ],\n):\n  \"\"\"Validates inputs and resolves an existing endpoint\
          \ or provisions an ephemeral one.\"\"\"\n  # KFP v2 serializes only the\
          \ component function body into the container.\n  # pylint: disable=g-import-not-at-top\n\
          \  import datetime\n  import logging\n  import re\n  import urllib.parse\n\
