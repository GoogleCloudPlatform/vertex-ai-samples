# PIPELINE DEFINITION
# Name: alphagenome-batch-inference-pipeline
# Description: AlphaGenome Batch Inference Pipeline on Vertex AI. Supports existing Shared gRPC endpoints, existing Dedicated HTTP endpoints, and auto-provisioned ephemeral GPU endpoints with automatic ExitHandler teardown and GCS shard checkpointing.
# Inputs:
#    cleanup_ephemeral_endpoint: bool [Default: True]
#    encryption_spec_key_name: str [Default: '']
#    existing_endpoint: str [Default: '']
#    existing_vertex_ai_url: str [Default: '']
#    fail_on_any_error: bool [Default: False]
#    impersonate_service_account: str [Default: '']
#    input_gcs_uri: str
#    max_retries: int [Default: 4.0]
#    model_version: str [Default: 'ALL_FOLDS']
#    output_gcs_uri: str
#    project_id: str [Default: '{{$.pipeline_google_cloud_project_id}}']
#    region: str [Default: 'us-central1']
#    save_tidy_scores: bool [Default: True]
#    sdk_wheel_url: str [Default: 'https://github.com/GoogleCloudPlatform/vertex-ai-samples/raw/main/notebooks/community/alphagenome/whl/alphagenome_cloud_sdk-0.4.2.12-py3-none-any.whl']
#    serving_accelerator_count: int [Default: 1.0]
#    serving_accelerator_type: str [Default: 'NVIDIA_H100_80GB']
#    serving_compute_reservation_id: str [Default: '']
#    serving_image_uri: str [Default: 'us-docker.pkg.dev/vertex-ai-restricted/alphagenome/alphagenome-inference:agv1_mg_004_rc_20261102']
#    serving_machine_type: str [Default: '']
#    serving_replica_count: int [Default: 8.0]
#    timeout: float [Default: 180.0]
#    workers: int [Default: 8.0]
components:
  comp-cleanup-ephemeral-endpoint-op:
    executorLabel: exec-cleanup-ephemeral-endpoint-op
    inputDefinitions:
      parameters:
        cleanup_ephemeral_endpoint:
          defaultValue: true
          isOptional: true
          parameterType: BOOLEAN
        existing_endpoint:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        existing_vertex_ai_url:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        job_name:
          parameterType: STRING
        project_id:
          parameterType: STRING
        region:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-exit-handler-1:
    dag:
      tasks:
        resolve-or-provision-endpoint-op:
          cachingOptions: {}
          componentRef:
            name: comp-resolve-or-provision-endpoint-op
          inputs:
            parameters:
              encryption_spec_key_name:
                componentInputParameter: pipelinechannel--encryption_spec_key_name
              existing_endpoint:
                componentInputParameter: pipelinechannel--existing_endpoint
              existing_vertex_ai_url:
                componentInputParameter: pipelinechannel--existing_vertex_ai_url
              input_gcs_uri:
                componentInputParameter: pipelinechannel--input_gcs_uri
              job_name:
                runtimeValue:
                  constant: '{{$.pipeline_job_name}}'
              max_retries:
                componentInputParameter: pipelinechannel--max_retries
              model_version:
                componentInputParameter: pipelinechannel--model_version
              output_gcs_uri:
                componentInputParameter: pipelinechannel--output_gcs_uri
              project_id:
                componentInputParameter: pipelinechannel--project_id
              region:
                componentInputParameter: pipelinechannel--region
              sdk_wheel_url:
                componentInputParameter: pipelinechannel--sdk_wheel_url
              serving_accelerator_count:
                componentInputParameter: pipelinechannel--serving_accelerator_count
              serving_accelerator_type:
                componentInputParameter: pipelinechannel--serving_accelerator_type
              serving_compute_reservation_id:
                componentInputParameter: pipelinechannel--serving_compute_reservation_id
              serving_image_uri:
                componentInputParameter: pipelinechannel--serving_image_uri
              serving_machine_type:
                componentInputParameter: pipelinechannel--serving_machine_type
              serving_replica_count:
                componentInputParameter: pipelinechannel--serving_replica_count
              timeout:
                componentInputParameter: pipelinechannel--timeout
              workers:
                componentInputParameter: pipelinechannel--workers
          taskInfo:
            name: resolve-or-provision-endpoint-op
        run-batch-inference-op:
          cachingOptions: {}
          componentRef:
            name: comp-run-batch-inference-op
          dependentTasks:
          - resolve-or-provision-endpoint-op
          inputs:
            parameters:
              fail_on_any_error:
                componentInputParameter: pipelinechannel--fail_on_any_error
              impersonate_service_account:
                componentInputParameter: pipelinechannel--impersonate_service_account
              input_gcs_uri:
                componentInputParameter: pipelinechannel--input_gcs_uri
              max_retries:
                componentInputParameter: pipelinechannel--max_retries
              model_version:
                componentInputParameter: pipelinechannel--model_version
              output_gcs_uri:
                componentInputParameter: pipelinechannel--output_gcs_uri
              project_id:
                componentInputParameter: pipelinechannel--project_id
              protocol:
                taskOutputParameter:
                  outputParameterKey: protocol
                  producerTask: resolve-or-provision-endpoint-op
              save_tidy_scores:
                componentInputParameter: pipelinechannel--save_tidy_scores
              sdk_wheel_url:
                componentInputParameter: pipelinechannel--sdk_wheel_url
              target:
                taskOutputParameter:
                  outputParameterKey: target
                  producerTask: resolve-or-provision-endpoint-op
              timeout:
                componentInputParameter: pipelinechannel--timeout
              workers:
                componentInputParameter: pipelinechannel--workers
          retryPolicy:
            backoffDuration: 0s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
            maxRetryCount: 2
          taskInfo:
            name: run-batch-inference-op
    inputDefinitions:
      parameters:
        pipelinechannel--encryption_spec_key_name:
          parameterType: STRING
        pipelinechannel--existing_endpoint:
          parameterType: STRING
        pipelinechannel--existing_vertex_ai_url:
          parameterType: STRING
        pipelinechannel--fail_on_any_error:
          parameterType: BOOLEAN
        pipelinechannel--impersonate_service_account:
          parameterType: STRING
        pipelinechannel--input_gcs_uri:
          parameterType: STRING
        pipelinechannel--max_retries:
          parameterType: NUMBER_INTEGER
        pipelinechannel--model_version:
          parameterType: STRING
        pipelinechannel--output_gcs_uri:
          parameterType: STRING
        pipelinechannel--project_id:
          parameterType: STRING
        pipelinechannel--region:
          parameterType: STRING
        pipelinechannel--save_tidy_scores:
          parameterType: BOOLEAN
        pipelinechannel--sdk_wheel_url:
          parameterType: STRING
        pipelinechannel--serving_accelerator_count:
          parameterType: NUMBER_INTEGER
        pipelinechannel--serving_accelerator_type:
          parameterType: STRING
        pipelinechannel--serving_compute_reservation_id:
          parameterType: STRING
        pipelinechannel--serving_image_uri:
          parameterType: STRING
        pipelinechannel--serving_machine_type:
          parameterType: STRING
        pipelinechannel--serving_replica_count:
          parameterType: NUMBER_INTEGER
        pipelinechannel--timeout:
          parameterType: NUMBER_DOUBLE
        pipelinechannel--workers:
          parameterType: NUMBER_INTEGER
  comp-resolve-or-provision-endpoint-op:
    executorLabel: exec-resolve-or-provision-endpoint-op
    inputDefinitions:
      parameters:
        encryption_spec_key_name:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        existing_endpoint:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        existing_vertex_ai_url:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        input_gcs_uri:
          parameterType: STRING
        job_name:
          parameterType: STRING
        max_retries:
          defaultValue: 4.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        model_version:
          defaultValue: ALL_FOLDS
          isOptional: true
          parameterType: STRING
        output_gcs_uri:
          parameterType: STRING
        project_id:
          parameterType: STRING
        region:
          parameterType: STRING
        sdk_wheel_url:
          defaultValue: https://github.com/GoogleCloudPlatform/vertex-ai-samples/raw/main/notebooks/community/alphagenome/whl/alphagenome_cloud_sdk-0.4.2.12-py3-none-any.whl
          isOptional: true
          parameterType: STRING
        serving_accelerator_count:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        serving_accelerator_type:
          defaultValue: NVIDIA_H100_80GB
          isOptional: true
          parameterType: STRING
        serving_compute_reservation_id:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        serving_image_uri:
          defaultValue: us-docker.pkg.dev/vertex-ai-restricted/alphagenome/alphagenome-inference:agv1_mg_004_rc_20261102
          isOptional: true
          parameterType: STRING
        serving_machine_type:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        serving_replica_count:
          defaultValue: 8.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        timeout:
          defaultValue: 180.0
          isOptional: true
          parameterType: NUMBER_DOUBLE
        workers:
          defaultValue: 8.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        ephemeral_endpoint_name:
          parameterType: STRING
        ephemeral_model_name:
          parameterType: STRING
        protocol:
          parameterType: STRING
        target:
          parameterType: STRING
  comp-run-batch-inference-op:
    executorLabel: exec-run-batch-inference-op
    inputDefinitions:
      parameters:
        checkpoint_interval:
          defaultValue: 50.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        fail_on_any_error:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        impersonate_service_account:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        input_gcs_uri:
          parameterType: STRING
        max_retries:
          defaultValue: 4.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        model_version:
          defaultValue: ALL_FOLDS
          isOptional: true
          parameterType: STRING
        output_gcs_uri:
          parameterType: STRING
        project_id:
          parameterType: STRING
        protocol:
          parameterType: STRING
        save_tidy_scores:
          defaultValue: true
          isOptional: true
          parameterType: BOOLEAN
        sdk_wheel_url:
          defaultValue: https://github.com/GoogleCloudPlatform/vertex-ai-samples/raw/main/notebooks/community/alphagenome/whl/alphagenome_cloud_sdk-0.4.2.12-py3-none-any.whl
          isOptional: true
          parameterType: STRING
        target:
          parameterType: STRING
        timeout:
          defaultValue: 180.0
          isOptional: true
          parameterType: NUMBER_DOUBLE
        workers:
          defaultValue: 8.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        errors_gcs_uri:
          parameterType: STRING
        failed_requests:
          parameterType: NUMBER_INTEGER
        predictions_gcs_uri:
          parameterType: STRING
        successful_requests:
          parameterType: NUMBER_INTEGER
        summary_gcs_uri:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-cleanup-ephemeral-endpoint-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - cleanup_ephemeral_endpoint_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-aiplatform>=1.60.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.2'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef cleanup_ephemeral_endpoint_op(\n    project_id: str,\n    region:\
          \ str,\n    job_name: str,\n    existing_endpoint: str = \"\",\n    existing_vertex_ai_url:\
          \ str = \"\",\n    cleanup_ephemeral_endpoint: bool = True,\n) -> str:\n\
          \  \"\"\"ExitHandler task: undeploys and deletes any ephemeral Endpoint\
          \ and Model.\"\"\"\n  import logging\n\n  # pytype: disable=import-error\n\
          \  import google.auth\n  from google.cloud import aiplatform_v1\n  # pytype:\
          \ enable=import-error\n\n  logging.basicConfig(\n      level=logging.INFO,\n\
          \      format=\"%(asctime)s %(levelname)s %(message)s\",\n  )\n\n  if (existing_endpoint\
          \ or \"\").strip() or (\n      existing_vertex_ai_url or \"\"\n  ).strip():\n\
          \    logging.info(\n        \"Pre-existing customer endpoint specified;\
          \ skipping ephemeral cleanup.\"\n    )\n    return \"SKIPPED:existing_endpoint\"\
          \n\n  if not cleanup_ephemeral_endpoint:\n    logging.info(\n        \"\
          cleanup_ephemeral_endpoint=False; retaining ephemeral resources.\"\n   \
          \ )\n    return \"SKIPPED:cleanup_disabled\"\n\n  job_clean = (job_name\
          \ or \"\").strip()\n  if not job_clean or \"{{\" in job_clean:\n    logging.warning(\n\
          \        \"Invalid job_name %r; skipping cleanup for safety.\", job_name\n\
          \    )\n    return \"SKIPPED:invalid_job_name\"\n\n  region_clean = (region\
          \ or \"\").strip()\n  if not region_clean:\n    return \"SKIPPED:missing_region\"\
          \n\n  resolved_project = (project_id or \"\").strip()\n  if not resolved_project\
          \ or \"{{\" in resolved_project:\n    _, default_project = google.auth.default()\n\
          \    resolved_project = default_project or \"\"\n  if not resolved_project:\n\
          \    raise ValueError(\"Cannot determine project_id for ephemeral cleanup.\"\
          )\n\n  display_name = f\"alphagenome-batch-{job_clean}\"\n  parent = f\"\
          projects/{resolved_project}/locations/{region_clean}\"\n  client_options\
          \ = {\"api_endpoint\": f\"{region_clean}-aiplatform.googleapis.com\"}\n\n\
          \  endpoint_client = aiplatform_v1.EndpointServiceClient(\n      client_options=client_options\n\
          \  )\n  model_client = aiplatform_v1.ModelServiceClient(client_options=client_options)\n\
          \n  deleted_resources: list[str] = []\n  cleanup_errors: list[str] = []\n\
          \n  matching_endpoints = [\n      ep\n      for ep in endpoint_client.list_endpoints(\n\
          \          parent=parent, filter=f'display_name=\"{display_name}\"'\n  \
          \    )\n      if ep.display_name == display_name\n  ]\n  for ep in matching_endpoints:\n\
          \    for dm in ep.deployed_models:\n      try:\n        logging.info(\"\
          Undeploying model %s from %s...\", dm.id, ep.name)\n        endpoint_client.undeploy_model(\n\
          \            endpoint=ep.name, deployed_model_id=dm.id\n        ).result(timeout=1800)\n\
          \      except Exception as exc:  # pylint: disable=broad-exception-caught\n\
          \        msg = f\"Failed undeploying {dm.id} from {ep.name}: {exc}\"\n \
          \       logging.error(msg)\n        cleanup_errors.append(msg)\n    try:\n\
          \      logging.info(\"Deleting ephemeral endpoint %s...\", ep.name)\n  \
          \    endpoint_client.delete_endpoint(name=ep.name).result(timeout=900)\n\
          \      deleted_resources.append(ep.name)\n    except Exception as exc: \
          \ # pylint: disable=broad-exception-caught\n      msg = f\"Failed deleting\
          \ endpoint {ep.name}: {exc}\"\n      logging.error(msg)\n      cleanup_errors.append(msg)\n\
          \n  matching_models = [\n      m\n      for m in model_client.list_models(\n\
          \          parent=parent, filter=f'display_name=\"{display_name}\"'\n  \
          \    )\n      if m.display_name == display_name\n  ]\n  for m in matching_models:\n\
          \    try:\n      logging.info(\"Deleting ephemeral model %s...\", m.name)\n\
          \      model_client.delete_model(name=m.name).result(timeout=900)\n    \
          \  deleted_resources.append(m.name)\n    except Exception as exc:  # pylint:\
          \ disable=broad-exception-caught\n      msg = f\"Failed deleting model {m.name}:\
          \ {exc}\"\n      logging.error(msg)\n      cleanup_errors.append(msg)\n\n\
          \  if cleanup_errors:\n    raise RuntimeError(\n        \"One or more ephemeral\
          \ resources failed to clean up: \"\n        + \"; \".join(cleanup_errors)\n\
          \    )\n\n  if not deleted_resources:\n    logging.info(\n        \"No ephemeral\
          \ resources found matching display_name=%r.\",\n        display_name,\n\
          \    )\n    return f\"NO_RESOURCES_FOUND:{display_name}\"\n\n  return \"\
          DELETED:\" + \",\".join(deleted_resources)\n\n"
        image: python:3.11-slim
    exec-resolve-or-provision-endpoint-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - resolve_or_provision_endpoint_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-aiplatform>=1.60.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.14.2'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef resolve_or_provision_endpoint_op(\n    project_id: str,\n   \
          \ region: str,\n    job_name: str,\n    input_gcs_uri: str,\n    output_gcs_uri:\
          \ str,\n    existing_endpoint: str = \"\",\n    existing_vertex_ai_url:\
          \ str = \"\",\n    model_version: str = \"ALL_FOLDS\",\n    workers: int\
          \ = 8,\n    timeout: float = 180.0,\n    max_retries: int = 4,\n    sdk_wheel_url:\
          \ str = (\n        \"https://github.com/GoogleCloudPlatform/vertex-ai-samples/raw/main/\"\
          \n        \"notebooks/community/alphagenome/whl/\"\n        \"alphagenome_cloud_sdk-0.4.2.12-py3-none-any.whl\"\
          \n    ),\n    serving_image_uri: str = (\n        \"us-docker.pkg.dev/vertex-ai-restricted/\"\
          \n        \"alphagenome/alphagenome-inference:agv1_mg_004_rc_20261102\"\n\
          \    ),\n    serving_machine_type: str = \"\",\n    serving_accelerator_type:\
          \ str = \"NVIDIA_H100_80GB\",\n    serving_accelerator_count: int = 1,\n\
          \    serving_replica_count: int = 8,\n    serving_compute_reservation_id:\
          \ str = \"\",\n    encryption_spec_key_name: str = \"\",\n) -> NamedTuple(\
          \  # pytype: disable=invalid-annotation  # pyrefly: ignore[invalid-annotation]\n\
          \    \"EndpointResolution\",\n    [\n        (\"protocol\", str),\n    \
          \    (\"target\", str),\n        (\"ephemeral_endpoint_name\", str),\n \
          \       (\"ephemeral_model_name\", str),\n    ],\n):\n  \"\"\"Validates\
          \ inputs and resolves an existing endpoint or provisions an ephemeral one.\"\
          \"\"\n  import datetime\n  import logging\n  import re\n  from urllib.parse\
          \ import urlparse\n\n  # pytype: disable=import-error\n  import google.auth\n\
          \  from google.cloud import aiplatform_v1\n  # pytype: enable=import-error\n\
          \n  logging.basicConfig(\n      level=logging.INFO,\n      format=\"%(asctime)s\
          \ %(levelname)s %(message)s\",\n  )\n\n  region = (region or \"\").strip()\n\
          \  if not region:\n    raise ValueError(\"region must be provided (e.g.,\
          \ 'us-central1').\")\n\n  def _validate_gcs_uri(\n      uri: str, param_name:\
          \ str, require_object_or_prefix: bool\n  ) -> None:\n    cleaned = (uri\
          \ or \"\").strip()\n    if not cleaned.startswith(\"gs://\"):\n      raise\
          \ ValueError(f\"{param_name} must start with 'gs://', got: {uri!r}\")\n\
          \    without_scheme = cleaned[len(\"gs://\") :]\n    parts = without_scheme.split(\"\
          /\", 1)\n    bucket_name = parts[0].strip()\n    blob_part = parts[1].strip()\
          \ if len(parts) > 1 else \"\"\n    if not bucket_name:\n      raise ValueError(f\"\
          {param_name} is missing a GCS bucket name: {uri!r}\")\n    if require_object_or_prefix\
          \ and not blob_part:\n      raise ValueError(\n          f\"{param_name}\
          \ must specify an object path or prefix inside \"\n          f\"gs://{bucket_name}/,\
          \ got: {uri!r}\"\n      )\n\n  _validate_gcs_uri(\n      input_gcs_uri,\
          \ \"input_gcs_uri\", require_object_or_prefix=True\n  )\n  _validate_gcs_uri(\n\
          \      output_gcs_uri, \"output_gcs_uri\", require_object_or_prefix=False\n\
          \  )\n\n  if workers < 1:\n    raise ValueError(f\"workers must be >= 1,\
          \ got: {workers}\")\n  if timeout <= 0:\n    raise ValueError(f\"timeout\
          \ must be > 0, got: {timeout}\")\n  if max_retries < 0:\n    raise ValueError(f\"\
          max_retries must be >= 0, got: {max_retries}\")\n\n  valid_model_versions\
          \ = (\"ALL_FOLDS\", \"FOLD_0\", \"FOLD_1\", \"FOLD_2\", \"FOLD_3\")\n  normalized_version\
          \ = (\n      (model_version or \"\").strip().replace(\"MODEL_VERSION_\"\
          , \"\").upper()\n  )\n  if normalized_version not in valid_model_versions:\n\
          \    raise ValueError(\n        f\"Invalid model_version {model_version!r}.\
          \ \"\n        f\"Must be one of {list(valid_model_versions)}.\"\n    )\n\
          \n  wheel_clean = (sdk_wheel_url or \"\").strip()\n  parsed_wheel = urlparse(wheel_clean)\n\
          \  if parsed_wheel.scheme not in (\n      \"https\",\n      \"gs\",\n  )\
          \ or not parsed_wheel.path.endswith(\".whl\"):\n    raise ValueError(\n\
          \        \"sdk_wheel_url must be an 'https://' or 'gs://' URL pointing to\
          \ a \"\n        f\"'.whl' package, got: {sdk_wheel_url!r}\"\n    )\n\n \
          \ endpoint_clean = (existing_endpoint or \"\").strip()\n  url_clean = (existing_vertex_ai_url\
          \ or \"\").strip()\n  if endpoint_clean and url_clean:\n    raise ValueError(\n\
          \        \"Both existing_endpoint and existing_vertex_ai_url are set. \"\
          \n        \"Please set only one (existing_endpoint for a Shared/Standard\
          \ gRPC \"\n        \"endpoint, or existing_vertex_ai_url for a Dedicated\
          \ HTTP endpoint), \"\n        \"or leave both empty to auto-provision an\
          \ ephemeral endpoint.\"\n    )\n\n  resolved_project = (project_id or \"\
          \").strip()\n  if not resolved_project or \"{{\" in resolved_project:\n\
          \    _, default_project = google.auth.default()\n    resolved_project =\
          \ default_project or \"\"\n\n  # Mode B: Existing Dedicated HTTP Endpoint\
          \ (:streamRawPredict URL).\n  if url_clean:\n    parsed_url = urlparse(url_clean)\n\
          \    if parsed_url.scheme != \"https\" or not parsed_url.netloc:\n     \
          \ raise ValueError(\n          \"existing_vertex_ai_url must be a valid\
          \ 'https://' URL (e.g.,\"\n          \" https://<DNS>/v1/projects/...:streamRawPredict),\
          \ got:\"\n          f\" {url_clean!r}\"\n      )\n    logging.info(\"Using\
          \ existing Dedicated HTTP endpoint: %s\", url_clean)\n    return (\"http\"\
          , url_clean, \"\", \"\")\n\n  # Mode A: Existing Shared/Standard gRPC Endpoint\
