              project_id:
                runtimeValue:
                  constant: '{{$.pipeline_google_cloud_project_id}}'
              protocol:
                taskOutputParameter:
                  outputParameterKey: protocol
                  producerTask: resolve-or-provision-endpoint-op
              save_tidy_scores:
                componentInputParameter: pipelinechannel--save_tidy_scores
              sdk_wheel_url:
                runtimeValue:
                  constant: https://github.com/GoogleCloudPlatform/vertex-ai-samples/raw/552011a70573f69774f958f7519d144c35e8cc1d/notebooks/community/alphagenome/whl/alphagenome_cloud_sdk-0.4.2.12-py3-none-any.whl#sha256=a872dd3f152d70e82977ea2e3129c5846957347cfec7f164ae6eb351032f1acd
              target:
