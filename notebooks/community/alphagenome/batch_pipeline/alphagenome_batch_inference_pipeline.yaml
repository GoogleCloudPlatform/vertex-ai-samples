          \ 3),\n            \"artifact_uris\": uris,\n            \"scores_count\"\
          : len(scores),\n            \"score_shapes\": shapes,\n        }\n\n   \
          \   if req_type == \"score_ism_variants\":\n        interval = _parse_interval(data[\"\
          interval\"])\n        raw_ism = data.get(\"ism_interval\") or data.get(\"\
          ismInterval\")\n        if isinstance(raw_ism, int):\n          ism_interval\
          \ = interval.resize(raw_ism)\n        elif raw_ism is not None:\n      \
          \    ism_interval = _parse_interval(raw_ism)\n        else:\n          ism_width\
          \ = int(data.get(\"ism_width\", 20))\n          ism_interval = interval.resize(ism_width)\n\
          \        v_scorers = _parse_variant_scorers(\n            data.get(\"variant_scorers\"\
          )\n            or data.get(\"variantScorers\")\n            or [{\n    \
          \            \"type\": \"CenterMaskScorer\",\n                \"requested_output\"\
          : \"DNASE\",\n                \"width\": 501,\n                \"aggregation_type\"\
          : \"DIFF_MEAN\",\n            }]\n        )\n        org = _parse_organism(data.get(\"\
          organism\"))\n\n        def _call_ism() -> Any:\n          try:\n      \
          \      return client.score_ism_variants(\n                interval=interval,\n\
          \                ism_interval=ism_interval,\n                variant_scorers=v_scorers,\n\
          \                organism=org,\n                progress_bar=False,\n  \
          \          )\n          except TypeError:\n            return client.score_ism_variants(\n\
          \                interval=interval,\n                ism_interval=ism_interval,\n\
          \                variant_scorers=v_scorers,\n                organism=org,\n\
          \            )\n\n        ism_scores, attempts = _execute_with_retry(_call_ism,\
          \ request_id)\n        uris, shapes = _save_anndata_scores(stem, ism_scores,\
          \ is_ism=True)\n        return {\n            \"index\": index,\n      \
          \      \"request_id\": request_id,\n            \"request_type\": req_type,\n\
          \            \"model_version\": row_mv.name,\n            \"status\": \"\
          SUCCESS\",\n            \"attempts\": attempts,\n            \"latency_sec\"\
          : round(time.perf_counter() - t0, 3),\n            \"artifact_uris\": uris,\n\
          \            \"ism_variants_scored\": len(ism_scores),\n            \"score_shapes\"\
          : shapes,\n        }\n\n      if req_type == \"output_metadata\":\n    \
          \    org = _parse_organism(data.get(\"organism\"))\n        meta_obj, attempts\
          \ = _execute_with_retry(\n            lambda: client.output_metadata(org),\
          \ request_id\n        )\n        meta_uris: dict[str, str] = {}\n      \
          \  meta_counts: dict[str, int] = {}\n        with tempfile.TemporaryDirectory()\
          \ as tmp_dir:\n          for trk in track_names:\n            mdf = getattr(meta_obj,\
          \ trk, None)\n            if isinstance(mdf, pd.DataFrame) and not mdf.empty:\n\
          \              meta_counts[trk] = len(mdf)\n              local_pq = os.path.join(tmp_dir,\
          \ f\"{stem}_{trk}.parquet\")\n              _sanitize_dataframe_for_parquet(mdf).to_parquet(\n\
          \                  local_pq, index=False\n              )\n            \
          \  pq_blob = f\"{base_prefix_blob}metadata/{stem}_{trk}.parquet\"\n    \
          \          meta_uris[trk] = _upload_file_to_gcs(\n                  local_pq,\
          \ pq_blob, \"application/octet-stream\"\n              )\n        return\
          \ {\n            \"index\": index,\n            \"request_id\": request_id,\n\
          \            \"request_type\": req_type,\n            \"model_version\"\
          : row_mv.name,\n            \"status\": \"SUCCESS\",\n            \"attempts\"\
          : attempts,\n            \"latency_sec\": round(time.perf_counter() - t0,\
          \ 3),\n            \"artifact_uris\": meta_uris,\n            \"track_counts\"\
          : meta_counts,\n        }\n\n      raise ValueError(f\"Unsupported request_type:\
          \ {req_type!r}\")\n\n    except Exception as exc:  # pylint: disable=broad-exception-caught\n\
          \      attempts_used = int(getattr(exc, \"_attempts\", 1))\n      logging.warning(\n\
          \          \"Request %s (index=%d, type=%s) failed after %d attempt(s):\
          \ %s\",\n          request_id,\n          index,\n          req_type,\n\
          \          attempts_used,\n          exc,\n      )\n      return {\n   \
          \       \"index\": index,\n          \"request_id\": request_id,\n     \
          \     \"request_type\": req_type,\n          \"status\": \"FAILED\",\n \
          \         \"attempts\": attempts_used,\n          \"latency_sec\": round(time.perf_counter()\
          \ - t0, 3),\n          \"error\": str(exc),\n      }\n\n  results: list[dict[str,\
          \ Any]] = [\n      {\n          \"index\": i,\n          \"request_id\"\
          : raw_request_ids[i],\n          \"status\": \"FAILED\",\n          \"error\"\
          : \"Unprocessed\",\n      }\n      for i in range(total_requests)\n  ]\n\
          \  for idx, rec in resumed_records.items():\n    results[idx] = rec\n\n\
          \  pending_indices = [\n      i for i in range(total_requests) if i not\
          \ in resumed_records\n  ]\n\n  checkpoint_buffer: list[dict[str, Any]] =\
          \ []\n  shard_counter = 0\n  succeeded_live = 0\n  failed_live = 0\n  run_epoch_ms\
          \ = int(time.time() * 1000)\n  flush_every = max(1, int(checkpoint_interval))\n\
          \n  def _flush_checkpoint_buffer() -> None:\n    nonlocal shard_counter\n\
          \    if not checkpoint_buffer:\n      return\n    shard_counter += 1\n \
          \   shard_blob_name = (\n        f\"{checkpoints_prefix_blob}\"\n      \
          \  f\"part-{run_epoch_ms}-{shard_counter:05d}.jsonl\"\n    )\n    shard_payload\
          \ = (\n        \"\\n\".join(json.dumps(item) for item in checkpoint_buffer)\
          \ + \"\\n\"\n    )\n    out_bucket.blob(shard_blob_name).upload_from_string(\n\
          \        shard_payload, content_type=\"application/jsonl\"\n    )\n    checkpoint_buffer.clear()\n\
          \    logging.info(\n        \"Flushed checkpoint shard %d (%s): %d/%d succeeded\
          \ (%d resumed), \"\n        \"%d failed.\",\n        shard_counter,\n  \
          \      shard_blob_name,\n        len(resumed_records) + succeeded_live,\n\
          \        total_requests,\n        len(resumed_records),\n        failed_live,\n\
          \    )\n\n  start_wall = time.perf_counter()\n  try:\n    if pending_indices:\n\
          \      with concurrent.futures.ThreadPoolExecutor(\n          max_workers=max(1,\
          \ int(workers))\n      ) as executor:\n        future_to_idx = {\n     \
          \       executor.submit(_process_one_row, idx): idx\n            for idx\
          \ in pending_indices\n        }\n        for future in concurrent.futures.as_completed(future_to_idx):\n\
          \          idx = future_to_idx[future]\n          try:\n            rec\
          \ = future.result()\n          except Exception as exc:  # pylint: disable=broad-exception-caught\n\
          \            logging.warning(\n                \"Worker raised unexpected\
          \ error on request %s (index=%d): %s\",\n                raw_request_ids[idx],\n\
          \                idx,\n                exc,\n            )\n           \
          \ rec = {\n                \"index\": idx,\n                \"request_id\"\
          : raw_request_ids[idx],\n                \"status\": \"FAILED\",\n     \
          \           \"attempts\": 1,\n                \"error\": str(exc),\n   \
          \         }\n          if rec.get(\"status\") == \"SUCCESS\":\n        \
          \    rec[\"request_sha256\"] = request_hashes[idx]\n            succeeded_live\
          \ += 1\n            results[idx] = rec\n            checkpoint_buffer.append(rec)\n\
          \            if len(checkpoint_buffer) >= flush_every:\n              _flush_checkpoint_buffer()\n\
          \          else:\n            failed_live += 1\n            results[idx]\
          \ = rec\n  finally:\n    _flush_checkpoint_buffer()\n\n  elapsed_sec = time.perf_counter()\
          \ - start_wall\n  successes = sum(1 for r in results if r.get(\"status\"\
          ) == \"SUCCESS\")\n  failures = total_requests - successes\n  newly_processed\
          \ = len(pending_indices)\n  pending_indices_set = set(pending_indices)\n\
          \  latencies = [\n      float(r[\"latency_sec\"])\n      for r in results\n\
          \      if \"latency_sec\" in r and r.get(\"index\") in pending_indices_set\n\
          \  ]\n\n  predictions_payload = \"\\n\".join(json.dumps(r) for r in results)\
          \ + (\n      \"\\n\" if results else \"\"\n  )\n  out_bucket.blob(predictions_blob_path).upload_from_string(\n\
          \      predictions_payload, content_type=\"application/jsonl\"\n  )\n  predictions_uri\
          \ = f\"gs://{out_bucket_name}/{predictions_blob_path}\"\n\n  written_errors_uri\
          \ = \"\"\n  if failures > 0:\n    error_records = [\n        {**r, \"raw_input\"\
          : raw_lines[r.get(\"index\", idx)]}\n        for idx, r in enumerate(results)\n\
          \        if r.get(\"status\") != \"SUCCESS\"\n    ]\n    errors_payload\
          \ = \"\\n\".join(json.dumps(er) for er in error_records) + \"\\n\"\n   \
          \ out_bucket.blob(errors_blob_path).upload_from_string(\n        errors_payload,\
          \ content_type=\"application/jsonl\"\n    )\n    written_errors_uri = f\"\
          gs://{out_bucket_name}/{errors_blob_path}\"\n\n  summary_dict = {\n    \
          \  \"timestamp_utc\": datetime.datetime.now(datetime.timezone.utc).isoformat(),\n\
          \      \"protocol\": protocol_clean,\n      \"target\": target,\n      \"\
          default_model_version\": default_mv.name,\n      \"input_gcs_uri\": normalized_input_gcs_uri,\n\
          \      \"predictions_gcs_uri\": predictions_uri,\n      \"errors_gcs_uri\"\
          : written_errors_uri or None,\n      \"workers\": workers,\n      \"max_retries\"\
          : max_retries,\n      \"total_requests\": total_requests,\n      \"resumed_from_checkpoint_count\"\
          : len(resumed_records),\n      \"newly_processed_count\": newly_processed,\n\
          \      \"successful_requests\": successes,\n      \"failed_requests\": failures,\n\
          \      \"success_rate\": round(successes / total_requests, 6),\n      \"\
          wall_time_sec\": round(elapsed_sec, 3),\n      \"throughput_rps\": (\n \
          \         round(newly_processed / elapsed_sec, 3)\n          if elapsed_sec\
          \ > 0 and newly_processed > 0\n          else 0.0\n      ),\n      \"latency_avg_sec\"\
          : (\n          round(float(np.mean(latencies)), 3) if latencies else 0.0\n\
          \      ),\n      \"latency_p50_sec\": (\n          round(float(np.median(latencies)),\
          \ 3) if latencies else 0.0\n      ),\n      \"latency_p95_sec\": (\n   \
          \       round(float(np.percentile(latencies, 95)), 3) if latencies else\
          \ 0.0\n      ),\n      \"latency_p99_sec\": (\n          round(float(np.percentile(latencies,\
          \ 99)), 3) if latencies else 0.0\n      ),\n  }\n  out_bucket.blob(summary_blob_path).upload_from_string(\n\
          \      json.dumps(summary_dict, indent=2) + \"\\n\",\n      content_type=\"\
          application/json\",\n  )\n  summary_uri = f\"gs://{out_bucket_name}/{summary_blob_path}\"\
          \n\n  logging.info(\n      \"Batch complete: %d/%d succeeded (%d resumed\
          \ from checkpoints), \"\n      \"%d failed. Summary: %s\",\n      successes,\n\
          \      total_requests,\n      len(resumed_records),\n      failures,\n \
          \     summary_uri,\n  )\n\n  if successes == 0:\n    raise RuntimeError(\n\
          \        f\"All {total_requests} batch request(s) failed. \"\n        f\"\
          Inspect error details at {written_errors_uri}\"\n    )\n  if fail_on_any_error\
          \ and failures > 0:\n    raise RuntimeError(\n        f\"{failures}/{total_requests}\
          \ request(s) failed with \"\n        f\"fail_on_any_error=True. Inspect\
          \ {written_errors_uri}\"\n    )\n\n  return (\n      predictions_uri,\n\
          \      written_errors_uri,\n      summary_uri,\n      successes,\n     \
          \ failures,\n  )\n\n"
        image: python:3.11-slim
        resources:
          cpuLimit: 8.0
          memoryLimit: 32.0
          resourceCpuLimit: '8'
          resourceMemoryLimit: 32G
pipelineInfo:
  description: AlphaGenome Batch Inference Pipeline on Vertex AI. Supports existing
    Shared gRPC endpoints, existing Dedicated HTTP endpoints, and auto-provisioned
    ephemeral GPU endpoints with automatic ExitHandler teardown and GCS shard checkpointing.
  displayName: AlphaGenome Batch Inference Pipeline
  name: alphagenome-batch-inference-pipeline
root:
  dag:
    tasks:
      cleanup-ephemeral-endpoint-op:
        cachingOptions: {}
        componentRef:
          name: comp-cleanup-ephemeral-endpoint-op
        dependentTasks:
        - exit-handler-1
        inputs:
          parameters:
            cleanup_ephemeral_endpoint:
              componentInputParameter: cleanup_ephemeral_endpoint
            existing_endpoint:
              componentInputParameter: existing_endpoint
            existing_vertex_ai_url:
              componentInputParameter: existing_vertex_ai_url
            job_name:
              runtimeValue:
                constant: '{{$.pipeline_job_name}}'
            project_id:
              runtimeValue:
                constant: '{{$.pipeline_google_cloud_project_id}}'
            region:
              componentInputParameter: region
        taskInfo:
          name: cleanup-ephemeral-endpoint-op
        triggerPolicy:
          strategy: ALL_UPSTREAM_TASKS_COMPLETED
      exit-handler-1:
        componentRef:
          name: comp-exit-handler-1
        inputs:
          parameters:
            pipelinechannel--existing_endpoint:
              componentInputParameter: existing_endpoint
            pipelinechannel--existing_vertex_ai_url:
              componentInputParameter: existing_vertex_ai_url
            pipelinechannel--fail_on_any_error:
              componentInputParameter: fail_on_any_error
            pipelinechannel--impersonate_service_account:
              componentInputParameter: impersonate_service_account
            pipelinechannel--input_gcs_uri:
              componentInputParameter: input_gcs_uri
            pipelinechannel--max_retries:
              componentInputParameter: max_retries
            pipelinechannel--model_version:
              componentInputParameter: model_version
            pipelinechannel--output_gcs_uri:
              componentInputParameter: output_gcs_uri
            pipelinechannel--region:
              componentInputParameter: region
            pipelinechannel--save_tidy_scores:
              componentInputParameter: save_tidy_scores
            pipelinechannel--serving_accelerator_count:
              componentInputParameter: serving_accelerator_count
            pipelinechannel--serving_accelerator_type:
              componentInputParameter: serving_accelerator_type
            pipelinechannel--serving_compute_reservation_id:
              componentInputParameter: serving_compute_reservation_id
            pipelinechannel--serving_machine_type:
              componentInputParameter: serving_machine_type
            pipelinechannel--serving_replica_count:
              componentInputParameter: serving_replica_count
            pipelinechannel--timeout:
              componentInputParameter: timeout
            pipelinechannel--workers:
              componentInputParameter: workers
        taskInfo:
          name: alphagenome-ephemeral-cleanup-handler
  inputDefinitions:
    parameters:
      cleanup_ephemeral_endpoint:
        defaultValue: true
        description: 'Boolean (true or false, default: true). When

          true, automatically undeploys and deletes any auto-provisioned ephemeral

          endpoint and model on pipeline completion, failure, or cancellation.

          Pre-existing endpoints are never deleted.'
        isOptional: true
        parameterType: BOOLEAN
      existing_endpoint:
        defaultValue: ''
        description: 'Optional Vertex AI Shared (Standard) gRPC endpoint.

          Expected format:

          projects/<PROJECT>/locations/<REGION>/endpoints/<ENDPOINT_ID> (or bare

          <ENDPOINT_ID>). Leave empty if using existing_vertex_ai_url or ephemeral

          provisioning.'
        isOptional: true
        parameterType: STRING
      existing_vertex_ai_url:
        defaultValue: ''
        description: "Optional Vertex AI Dedicated HTTP endpoint URL.\nExpected format:\n\
          https://<DEDICATED_DNS>/v1/projects/<PROJECT>/locations/<REGION>/endpoints/<ENDPOINT_ID>:streamRawPredict.\n\
          \  Leave empty if using existing_endpoint or ephemeral provisioning."
        isOptional: true
        parameterType: STRING
      fail_on_any_error:
        defaultValue: false
        description: 'Boolean (true or false, default: false). When false,

          individual failed rows are isolated in errors.jsonl without failing the

          pipeline (unless 0 rows succeed). When true, fails if any row fails.'
        isOptional: true
        parameterType: BOOLEAN
      impersonate_service_account:
        defaultValue: ''
        description: 'Optional service account email (e.g.,

          my-sa@my-project.iam.gserviceaccount.com) to impersonate for cross-project

          endpoint prediction and GCS access. Leave empty to use the pipeline SA.'
        isOptional: true
        parameterType: STRING
      input_gcs_uri:
        description: 'Required GCS path to a JSONL request manifest file or folder

          prefix of .jsonl shards (e.g., gs://my-bucket/input/requests.jsonl). Bare

          <bucket>/<path> values are also normalized to gs://<bucket>/<path>.'
        parameterType: STRING
      max_retries:
        defaultValue: 4.0
        description: 'Maximum exponential-backoff retry attempts per request on

          transient gRPC/HTTP transport errors (>= 0, default: 4).'
        isOptional: true
        parameterType: NUMBER_INTEGER
      model_version:
        defaultValue: ALL_FOLDS
        description: 'Default AlphaGenome model fold when not overridden per row in

          JSONL. Allowed values: ALL_FOLDS (default), FOLD_0, FOLD_1, FOLD_2,

          FOLD_3.'
        isOptional: true
        parameterType: STRING
      output_gcs_uri:
        defaultValue: ''
        description: 'Optional custom GCS output folder prefix (e.g.,

          gs://my-bucket/batch_output/run_01/). Leave empty to save outputs under

          the Cloud Storage ''Output directory'' set in the next ''Runtime

          configuration'' step at <Output directory>/<job_name>/batch_output/.'
        isOptional: true
        parameterType: STRING
      region:
        defaultValue: us-central1
        description: 'Google Cloud region for ephemeral endpoint provisioning or bare

          endpoint IDs (e.g., us-central1, us-east5, us-west1, europe-west4).'
        isOptional: true
        parameterType: STRING
      save_tidy_scores:
        defaultValue: true
        description: 'Boolean (true or false, default: true). When true, also

          exports flattened tidy_scores Parquet tables alongside .h5ad AnnData files

          for score_variant, score_interval, and score_ism_variants requests.'
        isOptional: true
        parameterType: BOOLEAN
      serving_accelerator_count:
        defaultValue: 1.0
        description: 'Number of GPUs per ephemeral serving replica

          (ignored when using an existing endpoint). Allowed values: 1, 2, 4, or 8

          (default: 1).'
        isOptional: true
        parameterType: NUMBER_INTEGER
      serving_accelerator_type:
        defaultValue: NVIDIA_H100_80GB
        description: 'GPU accelerator type for ephemeral endpoint

          replicas (ignored when using an existing endpoint). Allowed values:

          NVIDIA_H100_80GB, NVIDIA_H100_MEGA_80GB, NVIDIA_A100_80GB.'
        isOptional: true
        parameterType: STRING
      serving_compute_reservation_id:
        defaultValue: ''
        description: 'Optional full Compute Engine reservation

          resource path (projects/<PROJECT>/zones/<ZONE>/reservations/<NAME>),

          DeploymentResourcePool resource path

          (projects/<PROJECT>/locations/<REGION>/deploymentResourcePools/<NAME>),

          ANY, or NONE for ephemeral serving. Leave empty for on-demand capacity.'
        isOptional: true
        parameterType: STRING
      serving_machine_type:
        defaultValue: ''
        description: 'Optional Compute Engine machine type override for

          ephemeral serving (e.g., a3-highgpu-1g, a3-highgpu-8g, a2-ultragpu-1g).

          Leave empty to auto-select from GPU type and total GPUs

          (serving_replica_count * serving_accelerator_count), or set explicitly to

          match a Compute Engine reservation''s machine type.'
        isOptional: true
        parameterType: STRING
      serving_replica_count:
        defaultValue: 8.0
        description: 'Number of serving replicas to deploy on an ephemeral

          endpoint (>= 1, default: 8; ignored when using an existing endpoint).'
        isOptional: true
        parameterType: NUMBER_INTEGER
      timeout:
        defaultValue: 180.0
        description: 'Per-request RPC/HTTP timeout in seconds (> 0, default: 180.0).

          Increase (e.g., 600.0) for large score_ism_variants intervals.'
        isOptional: true
        parameterType: NUMBER_DOUBLE
      workers:
        defaultValue: 8.0
        description: 'Number of concurrent client worker threads streaming requests
          to

          the endpoint (>= 1; recommended: 1-2 per GPU replica, default: 8).'
        isOptional: true
        parameterType: NUMBER_INTEGER
  singlePlatformSpecs:
  - config:
      ioMetadata:
        pages:
        - description: Configure Cloud Storage input/output paths, target serving
            endpoint (existing Shared gRPC, existing Dedicated HTTP, or auto-provisioned
            ephemeral GPU endpoint), and batch execution settings.
          name: Batch & Endpoint Configuration
          sections:
          - description: Specify your input JSONL request manifest in Cloud Storage
              and optional custom output prefix.
            inputs:
            - description: Required. GCS path to a JSONL request file or folder prefix
                of .jsonl shards (e.g., gs://my-bucket/input/requests.jsonl).
              displayName: "Input JSONL GCS URI \u2014 Required (input_gcs_uri)"
              name: input_gcs_uri
              semanticType:
                stringType:
                  freeForm:
                    regex: ^(gs://)?[^/:\s]+/[^\s]+$
                    validationError: Enter a GCS JSONL object or prefix (e.g., gs://my-bucket/input/requests.jsonl).
            - description: Optional. Leave empty to save outputs under the Cloud Storage
                'Output directory' set in the next 'Runtime configuration' step at
                <Output directory>/<job_name>/batch_output/, or enter a custom GCS
                folder (e.g., gs://my-bucket/batch_output/run_01/).
              displayName: "Custom Output GCS URI \u2014 Optional (output_gcs_uri)"
              name: output_gcs_uri
              semanticType:
                stringType:
                  freeForm:
                    regex: ^(gs://)?[^/:\s]+(/.*)?$
                    validationError: Enter a GCS URI (e.g., gs://my-bucket/output/)
                      or leave empty to use the Cloud Storage 'Output directory' in
                      the next 'Runtime configuration' step.
            - description: 'True or False (default: True). When checked, also exports
                flattened tidy_scores Parquet tables alongside .h5ad AnnData files
                for score_variant, score_interval, and score_ism_variants requests.'
              displayName: Save Tidy Scores Parquet Tables (save_tidy_scores)
              name: save_tidy_scores
              semanticType:
                booleanType: {}
            name: Input & Output Data
          - description: Provide an existing Shared gRPC endpoint OR an existing Dedicated
              HTTP endpoint URL, or leave both empty to auto-provision an ephemeral
              GPU endpoint.
            inputs:
            - description: 'Optional. For a Vertex AI Shared (Standard) gRPC endpoint
                only. Expected format: projects/<PROJECT>/locations/<REGION>/endpoints/<ENDPOINT_ID>
                (or bare <ENDPOINT_ID>). Leave empty if using a Dedicated HTTP endpoint
                or ephemeral provisioning.'
              displayName: "Existing Shared Endpoint \u2014 gRPC (existing_endpoint)"
              name: existing_endpoint
              semanticType:
                stringType:
                  freeForm: {}
            - description: 'Optional. For a Vertex AI Dedicated HTTP endpoint only.
                Expected format: https://<DEDICATED_DNS>/v1/projects/<PROJECT>/locations/<REGION>/endpoints/<ENDPOINT_ID>:streamRawPredict.
                Leave empty if using a Shared gRPC endpoint or ephemeral provisioning.'
              displayName: "Existing Dedicated Endpoint URL \u2014 HTTP (existing_vertex_ai_url)"
              name: existing_vertex_ai_url
              semanticType:
                stringType:
                  freeForm:
                    regex: ^https://[^\s]+$
                    validationError: Must be an https:// Dedicated Endpoint URL (e.g.,
                      https://<DEDICATED_DNS>/v1/projects/<PROJECT>/locations/<REGION>/endpoints/<ENDPOINT_ID>:streamRawPredict)
                      or left empty.
            - description: Google Cloud region for auto-provisioned ephemeral endpoints
                or bare endpoint IDs (e.g., us-central1, us-east5, us-west1, europe-west4).
              displayName: Endpoint Region (region)
              name: region
              semanticType:
                stringType:
                  freeForm: {}
            name: Endpoint Target
          - description: Configure model fold selection, client concurrency, retry
              behavior, and optional service account impersonation.
            inputs:
            - description: 'Default AlphaGenome model fold when not overridden per
                row in JSONL. Allowed values: ALL_FOLDS (ensemble default), FOLD_0,
                FOLD_1, FOLD_2, FOLD_3.'
              displayName: Model Version / Fold (model_version)
              name: model_version
              semanticType:
                stringType:
                  selectOne:
                    options:
                      values:
                      - ALL_FOLDS
                      - FOLD_0
                      - FOLD_1
                      - FOLD_2
                      - FOLD_3
            - description: 'Number of concurrent client worker threads streaming requests
                to the endpoint (>= 1; recommended: 1-2 per GPU replica, default:
                8).'
              displayName: Concurrent Workers (workers)
              name: workers
              semanticType:
                integerType:
                  max: 256.0
                  min: 1.0
                  validationError: workers must be an integer between 1 and 256.
            - description: 'Per-request RPC/HTTP timeout in seconds (> 0, default:
                180.0). Increase (e.g., 600.0) for large score_ism_variants intervals.'
              displayName: Per-Request Timeout Seconds (timeout)
              name: timeout
              semanticType:
                floatType:
                  max: 7200.0
                  min: 1.0
                  validationError: timeout must be between 1.0 and 7200.0 seconds.
            - description: 'Maximum exponential-backoff retry attempts per request
                on transient gRPC/HTTP transport errors (>= 0, default: 4).'
              displayName: Max Retries per Request (max_retries)
              name: max_retries
              semanticType:
                integerType:
                  max: 20.0
                  min: 0.0
                  validationError: max_retries must be an integer between 0 and 20.
            - description: 'True or False (default: False). When unchecked, individual
                failed rows are isolated in errors.jsonl without failing the pipeline
                (unless 0 rows succeed). When checked, fails if any single row fails.'
              displayName: Fail Pipeline on Any Failed Row (fail_on_any_error)
              name: fail_on_any_error
              semanticType:
                booleanType: {}
            - description: Optional service account email (e.g., my-sa@my-project.iam.gserviceaccount.com)
                to impersonate for cross-project endpoint prediction and GCS access.
                Leave empty to use the pipeline service account.
              displayName: "Impersonate Service Account \u2014 Optional (impersonate_service_account)"
              name: impersonate_service_account
              semanticType:
                stringType:
                  freeForm: {}
            name: Batch Execution Settings
          - description: Used only when both existing_endpoint and existing_vertex_ai_url
              are left empty. Ignored when targeting an existing endpoint.
            inputs:
            - description: 'GPU accelerator type for ephemeral endpoint replicas.
                Allowed values: NVIDIA_H100_80GB (a3-highgpu), NVIDIA_H100_MEGA_80GB
                (a3-megagpu-8g), NVIDIA_A100_80GB (a2-ultragpu).'
              displayName: GPU Accelerator Type (serving_accelerator_type)
              name: serving_accelerator_type
              semanticType:
                stringType:
                  selectOne:
                    options:
                      values:
                      - NVIDIA_H100_80GB
                      - NVIDIA_H100_MEGA_80GB
                      - NVIDIA_A100_80GB
            - description: 'Number of GPUs attached to each serving replica. Allowed
                values: 1, 2, 4, or 8 (default: 1).'
              displayName: GPUs per Replica (serving_accelerator_count)
              name: serving_accelerator_count
              semanticType:
                integerType:
                  max: 8.0
                  min: 1.0
                  validationError: serving_accelerator_count must be 1, 2, 4, or 8.
            - description: 'Number of serving replicas to deploy on the ephemeral
                endpoint (>= 1, default: 8).'
              displayName: Serving Replica Count (serving_replica_count)
              name: serving_replica_count
              semanticType:
                integerType:
                  max: 64.0
                  min: 1.0
                  validationError: serving_replica_count must be between 1 and 64.
            - description: Optional Compute Engine machine type (e.g., a3-highgpu-1g,
                a3-highgpu-8g, a2-ultragpu-1g). Leave empty to auto-select from GPU
                type and total GPUs (serving_replica_count * serving_accelerator_count),
                or set explicitly to match a Compute Engine reservation's machine
                type.
              displayName: "Serving Machine Type Override \u2014 Optional (serving_machine_type)"
              name: serving_machine_type
              semanticType:
                stringType:
                  freeForm: {}
            - description: Optional full Compute Engine reservation resource path
                (projects/<PROJECT>/zones/<ZONE>/reservations/<NAME>), DeploymentResourcePool
                resource path (projects/<PROJECT>/locations/<REGION>/deploymentResourcePools/<NAME>),
                ANY, or NONE. Leave empty for on-demand capacity.
              displayName: "Compute Reservation or Resource Pool \u2014 Optional (serving_compute_reservation_id)"
              name: serving_compute_reservation_id
              semanticType:
                stringType:
                  freeForm: {}
            - description: 'True or False (default: True). When checked, automatically
                undeploys and deletes any auto-provisioned ephemeral endpoint and
                model when the pipeline finishes, fails, or is cancelled. Pre-existing
                endpoints are never deleted.'
              displayName: Delete Ephemeral Endpoint on Exit (cleanup_ephemeral_endpoint)
              name: cleanup_ephemeral_endpoint
              semanticType:
                booleanType: {}
            name: Ephemeral Endpoint Provisioning
        schemaVersion: 2.1.0
    platform: google_cloud
